<title>Al-Fatiha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500&display=swap">
<style>
/* Mise en page : une scène 1080×1920 mise à l'échelle de l'écran, commandes en dessous.
   Un seul look, sombre et voulu (nuit, or, vert profond). */
:root {
  --nuit: #0B1D2E;
  --vert: #0E2A24;
  --or: #D8B56A;
  --or-pale: #EAD7A4;
  --creme: #F4EEDF;
  --brume: #B9C2C9;
  --page: #071420;
  --ar: "Amiri Quran", "Amiri", "Scheherazade New", serif;
  --fr: "Cormorant Garamond", Georgia, serif;
  --en: "Inter", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--page); color: var(--creme); font-family: var(--en);
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#cadre { position: relative; width: min(100%, calc((100vh - 150px) * 9 / 16)); aspect-ratio: 9 / 16; max-width: 100%; }
#scene {
  position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; transform-origin: 0 0;
  overflow: hidden; border-radius: 28px;
  background: radial-gradient(120% 80% at 50% 35%, #12314A 0%, var(--nuit) 55%, #06111C 100%);
}
#fond-vert { position: absolute; inset: 0; opacity: 0;
  background: radial-gradient(120% 80% at 50% 60%, #154036 0%, var(--vert) 55%, #061612 100%); }
#halo { position: absolute; width: 900px; height: 900px; left: 90px; top: 420px; border-radius: 50%;
  background: radial-gradient(circle, rgba(216,181,106,.22) 0%, rgba(216,181,106,0) 65%); }
#etoile { position: absolute; width: 1500px; height: 1500px; left: -210px; top: 210px; opacity: .13; }
#camera { position: absolute; inset: 0; }
.entete { position: absolute; top: 210px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.entete .nom { font-family: "Amiri", serif; font-size: 46px; color: var(--or-pale); }
#medaillon { width: 96px; height: 96px; display: grid; place-items: center; position: relative; }
#medaillon svg { position: absolute; inset: 0; }
#medaillon span { font-family: "Amiri", serif; font-size: 40px; color: var(--creme); position: relative; }
.verset { position: absolute; left: 90px; right: 90px; top: 420px; bottom: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; text-align: center; opacity: 0; }
.verset .ar { font-family: var(--ar); font-size: 92px; line-height: 1.75; direction: rtl; color: var(--creme); text-wrap: balance; }
.verset.long .ar { font-size: 74px; }
.verset .trait { width: 520px; height: 3px; background: linear-gradient(90deg, rgba(216,181,106,0), var(--or), rgba(216,181,106,0)); transform-origin: 100% 50%; }
.verset .fr { font-family: var(--fr); font-size: 50px; line-height: 1.3; color: var(--creme); text-wrap: balance; }
.verset .en { font-family: var(--en); font-size: 36px; line-height: 1.45; color: var(--brume); text-wrap: balance; }
.verset.long .fr { font-size: 44px; }
.verset.long .en { font-size: 33px; }
#titre { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; text-align: center; }
#titre .ar { font-family: var(--ar); font-size: 150px; color: var(--or-pale); direction: rtl; line-height: 1.6; margin-bottom: 20px; }
#titre .sous { font-family: var(--fr); font-size: 46px; color: var(--creme); }
#titre .sous2 { font-family: var(--en); font-size: 32px; color: var(--brume); letter-spacing: .12em; text-transform: uppercase; }
#credit { position: absolute; bottom: 120px; left: 0; right: 0; text-align: center; font-family: var(--en); font-size: 28px; color: var(--brume); opacity: .8; }
#commandes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; max-width: 640px; }
button, label.fichier {
  font: 500 14px var(--en); color: var(--page); background: var(--or); border: 0; border-radius: 999px;
  padding: 9px 16px; cursor: pointer;
}
label.fichier { background: transparent; color: var(--or-pale); box-shadow: inset 0 0 0 1px var(--or); }
button:focus-visible, label.fichier:focus-within { outline: 2px solid var(--creme); outline-offset: 2px; }
#audio-input { position: absolute; opacity: 0; width: 1px; height: 1px; }
#barre { width: min(640px, 100%); height: 4px; background: #1B2E3E; border-radius: 2px; overflow: hidden; }
#barre i { display: block; height: 100%; width: 0; background: var(--or); }
#note { font-size: 13px; color: var(--brume); max-width: 640px; text-align: center; line-height: 1.5; margin: 0; }
@media (prefers-reduced-motion: reduce) { #etoile { display: none; } }
</style>

<div id="cadre">
  <div id="scene" aria-label="Aperçu de la vidéo Al-Fatiha">
    <div id="fond-vert"></div>
    <div id="halo"></div>
    <canvas id="etoile" width="750" height="750"></canvas>
    <div id="camera">
      <div class="entete" id="entete" style="opacity:0">
        <div class="nom">سورة الفاتحة</div>
        <div id="medaillon">
          <svg viewBox="0 0 96 96"><g fill="none" stroke="#D8B56A" stroke-width="2"><rect x="20" y="20" width="56" height="56"/><rect x="20" y="20" width="56" height="56" transform="rotate(45 48 48)"/></g></svg>
          <span id="num">١</span>
        </div>
      </div>
      <div id="versets"></div>
      <div id="titre">
        <div class="ar">سُورَةُ ٱلْفَاتِحَة</div>
        <div class="sous">Al-Fatiha · L'Ouverture</div>
        <div class="sous2">The Opening</div>
      </div>
      <div id="credit"></div>
    </div>
  </div>
</div>

<div id="barre" aria-hidden="true"><i id="progres"></i></div>
<div id="commandes">
  <button id="lire" type="button">Lire</button>
  <button id="debut" type="button">Revenir au début</button>
  <label class="fichier">Ajouter la récitation (MP3)<input id="audio-input" type="file" accept="audio/*"></label>
</div>
<p id="note">Aperçu sans son : les secondes de chaque verset sont provisoires. Ajoutez le fichier de la récitation pour voir le texte défiler avec la voix ; le calage exact viendra des temps mesurés sur l'audio.</p>
<audio id="audio" preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="donnees.js"></script>
<script>
(function () {
  const T = window.TEXTE, S = window.TEMPS;
  const chiffres = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

  // Mise à l'échelle de la scène 1080×1920 dans son cadre
  const cadre = document.getElementById("cadre"), scene = document.getElementById("scene");
  const ajuster = () => { scene.style.transform = "scale(" + cadre.clientWidth / 1080 + ")"; };
  new ResizeObserver(ajuster).observe(cadre); ajuster();

  // Étoile à 8 branches (motif en filigrane), dessinée sur canvas
  const cv = document.getElementById("etoile"), cx = cv.getContext("2d");
  (function dessiner() {
    const c = 375; cx.strokeStyle = "#D8B56A"; cx.lineWidth = 2;
    for (let r = 340; r > 40; r -= 60) {
      for (let k = 0; k < 2; k++) {
        cx.save(); cx.translate(c, c); cx.rotate(k * Math.PI / 4 + r / 400);
        cx.strokeRect(-r / 1.414, -r / 1.414, r * 1.414, r * 1.414); cx.restore();
      }
      cx.beginPath(); cx.arc(c, c, r * 0.98, 0, Math.PI * 2); cx.globalAlpha = .5; cx.stroke(); cx.globalAlpha = 1;
    }
  })();

  // Construire les versets
  const zone = document.getElementById("versets");
  const els = T.versets.map(v => {
    const d = document.createElement("div");
    d.className = "verset" + (v.ar.length > 60 ? " long" : "");
    d.innerHTML = '<div class="ar"></div><div class="trait"></div><div class="fr"></div><div class="en"></div>';
    d.querySelector(".ar").textContent = v.ar;
    d.querySelector(".fr").textContent = v.fr;
    d.querySelector(".en").textContent = v.en;
    zone.appendChild(d); return d;
  });

  // Timeline : toutes les secondes viennent de TEMPS
  const tl = gsap.timeline({ paused: true });
  tl.set({}, {}, S.duree);
  tl.to("#etoile", { rotation: 40, ease: "none", duration: S.duree }, 0);
  tl.to("#halo", { x: 0, y: -260, scale: 1.25, ease: "sine.inOut", duration: S.duree }, 0);
  tl.to("#fond-vert", { opacity: 1, ease: "sine.inOut", duration: S.duree * 0.6 }, S.duree * 0.25);

  // Titre : visible dès l'image 0, puis s'efface
  tl.fromTo("#titre", { scale: 1.0, y: 0 }, { scale: 1.04, y: -20, duration: S.titre.fin, ease: "sine.out" }, 0);
  tl.to("#titre", { opacity: 0, y: -80, filter: "blur(6px)", duration: 0.6, ease: "power2.in" }, S.titre.fin - 0.6);
  tl.fromTo("#entete", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.8, ease: "expo.out" }, S.titre.fin - 0.2);

  S.versets.forEach((t, i) => {
    const el = els[i], q = s => el.querySelector(s);
    tl.set("#num", { textContent: chiffres(t.n) }, t.debut);
    tl.fromTo("#medaillon", { rotation: -45, scale: .8 }, { rotation: 0, scale: 1, duration: .8, ease: "expo.out" }, t.debut);
    tl.set(el, { opacity: 1 }, t.debut);
    tl.fromTo(q(".ar"), { opacity: 0, y: 50, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.0, ease: "expo.out" }, t.debut);
    tl.fromTo(q(".trait"), { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "power3.out" }, t.debut + 0.3);
    tl.fromTo(q(".fr"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .9, ease: "expo.out" }, t.debut + 0.5);
    tl.fromTo(q(".en"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .9, ease: "expo.out" }, t.debut + 0.75);
    tl.fromTo("#camera", { scale: 1 }, { scale: 1.035, duration: t.fin - t.debut, ease: "none" }, t.debut);
    // Le verset reste entier jusqu'à la fin de sa lecture, puis s'efface vers le haut
    tl.to(el, { opacity: 0, y: -60, filter: "blur(6px)", duration: .4, ease: "power2.in" }, t.fin);
  });

  // Fin : le titre revient
  tl.set("#credit", { textContent: "" }, 0);
  tl.to("#entete", { opacity: 0, duration: .4 }, S.fin.debut - 0.2);
  tl.fromTo("#titre", { opacity: 0, y: 60, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.2, ease: "expo.out", immediateRender: false }, S.fin.debut);

  // Horloge : l'audio s'il y en a un, sinon la timeline elle-même
  const audio = document.getElementById("audio"), lire = document.getElementById("lire");
  const progres = document.getElementById("progres");
  let avecAudio = false;
  gsap.ticker.add(() => {
    if (avecAudio) tl.time(Math.min(audio.currentTime, S.duree));
    progres.style.width = (tl.time() / S.duree * 100) + "%";
    lire.textContent = (avecAudio ? !audio.paused : tl.isActive()) ? "Pause" : "Lire";
  });
  lire.addEventListener("click", () => {
    if (avecAudio) { audio.paused ? audio.play() : audio.pause(); return; }
    if (tl.isActive()) tl.pause(); else { if (tl.progress() >= 1) tl.time(0); tl.play(); }
  });
  document.getElementById("debut").addEventListener("click", () => {
    if (avecAudio) audio.currentTime = 0; tl.pause(0);
  });
  document.getElementById("audio-input").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    audio.src = URL.createObjectURL(f); avecAudio = true; tl.pause(0);
    document.getElementById("note").textContent = "Récitation chargée : " + f.name + ". Les versets suivent la voix (secondes encore provisoires).";
  });
  window.__tl = tl;
  tl.time(0);
})();
</script>
